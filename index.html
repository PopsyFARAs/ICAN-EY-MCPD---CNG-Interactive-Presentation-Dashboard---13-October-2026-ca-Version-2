<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{color-scheme:light}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>CNG Energy Mix Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout concept: a forecourt control room. ICAN green command bar on top, layered module tabs,
   one presentation "screen" at a time on a calm green-tinted stage, with a pump-price board as the hero. */
:root {
  --bg: #F3F7F4;          /* stage, green-biased off-white */
  --surface: #FFFFFF;
  --tint-g: #E6F3EB;      /* ICAN green tint */
  --tint-n: #E8EEF7;      /* ICAN navy tint */
  --tint-gold: #FAF1DC;
  --tint-red: #FBE9E7;
  --ink: #13213A;         /* navy ink */
  --ink-2: #3F4F67;
  --muted: #66758A;
  --line: #D3DDD8;
  --green: #0F8845;       /* ICAN green */
  --green-ink: #0B6E37;
  --navy: #1C3A6C;        /* ICAN navy */
  --gold: #C8982A;
  --gold-ink: #8A6414;
  --lime: #6FBE44;        /* FinPolNomics lemon-green */
  --red: #B42318;
  --bar: #0F8845;         /* command bar */
  --bar-ink: #FFFFFF;
  --bar-2: #0C7039;
  --on-accent: #FFFFFF;
  --shadow: 0 1px 2px rgba(19,33,58,.06), 0 6px 18px rgba(19,33,58,.08);
  /* data series: validated reference order (blue, orange, aqua, yellow) + red */
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s8: #e34948;
  --grid: #E1E8E4;
  --board: #0D1B30; --board-ink: #FFC24A; --board-label: #CFE0F5; --board-line: #23395C;
  --f-display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", Arial, sans-serif;
  --f-body: "Barlow", "Segoe UI", Arial, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Consolas, monospace;
  --r: 12px;
  --rbmd: #1C3A6C;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0A1524; --surface: #10203A; --tint-g: #0F2D27; --tint-n: #14284A; --tint-gold: #2C2512; --tint-red: #33191A;
    --ink: #E8EFF7; --ink-2: #BBC8DA; --muted: #8E9DB3; --line: #22385A;
    --green: #2BB673; --green-ink: #5ED39A; --navy: #93B4EC; --gold: #E0B44A; --gold-ink: #F0C96A; --lime: #8ED36A; --red: #F07A6E;
    --bar: #0B5A31; --bar-ink: #F2FFF7; --bar-2: #094A28; --on-accent: #08131F;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s8: #e66767; --grid: #1C3150;
    --board: #050D19; --board-line: #1B2E4C; --rbmd: #2E5AA8;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0A1524; --surface: #10203A; --tint-g: #0F2D27; --tint-n: #14284A; --tint-gold: #2C2512; --tint-red: #33191A;
  --ink: #E8EFF7; --ink-2: #BBC8DA; --muted: #8E9DB3; --line: #22385A;
  --green: #2BB673; --green-ink: #5ED39A; --navy: #93B4EC; --gold: #E0B44A; --gold-ink: #F0C96A; --lime: #8ED36A; --red: #F07A6E;
  --bar: #0B5A31; --bar-ink: #F2FFF7; --bar-2: #094A28; --on-accent: #08131F;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s8: #e66767; --grid: #1C3150;
  --board: #050D19; --board-line: #1B2E4C; --rbmd: #2E5AA8;
  color-scheme: dark;
}
html { -webkit-text-size-adjust: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 16px; line-height: 1.5; }
* { box-sizing: border-box; }
button, input, textarea, select { font: inherit; color: inherit; }
a { color: var(--green-ink); }
:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; border-radius: 6px; }
#stage:focus, #stage:focus-visible { outline: none; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

/* ---------- command bar ---------- */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bar); color: var(--bar-ink); }
.bar-in { max-width: 1320px; margin: 0 auto; padding: 10px 16px; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.plaque { background: #FFFFFF; border-radius: 8px; padding: 4px 8px; display: flex; align-items: center; height: 46px; }
.plaque img { height: 38px; width: auto; display: block; }
.plaque.ey { background: #000000; padding: 3px; height: 46px; }
.plaque.ey img { height: 40px; }
.bar-title { flex: 1 1 280px; min-width: 0; }
.bar-title b { display: block; font-family: var(--f-display); font-weight: 700; font-size: 1.32rem; letter-spacing: .01em; line-height: 1.05; }
.bar-title span { display: block; font-size: .8rem; opacity: .9; }
.bar-tools { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.tool { background: var(--bar-2); color: var(--bar-ink); border: 1px solid rgba(255,255,255,.22); border-radius: 999px; padding: 6px 12px; font-size: .82rem; font-weight: 600; cursor: pointer; display: inline-flex; gap: 6px; align-items: center; }
.tool:hover { background: rgba(255,255,255,.16); }
.clock { font-family: var(--f-mono); font-size: .86rem; font-variant-numeric: tabular-nums; }

@media (max-width: 760px) {
  .bar { position: static; }
  .bar-in { gap: 8px; padding-block: 8px; }
  .bar-title { flex-basis: 100%; order: 3; }
  .bar-title b { font-size: 1.08rem; }
  .bar-title span { display: none; }
  .plaque, .plaque.ey { height: 38px; }
  .plaque img { height: 30px; } .plaque.ey img { height: 32px; }
  .bar-tools { order: 4; flex-basis: 100%; }
  .tool { padding: 4px 10px; font-size: .76rem; }
  .mods { top: env(safe-area-inset-top, 0px) !important; }
}
/* ---------- module tabs (layer 1) and screen tabs (layer 2) ---------- */
.mods { background: var(--surface); border-bottom: 1px solid var(--line); position: sticky; top: calc(env(safe-area-inset-top, 0px) + var(--barh, 66px)); z-index: 25; }
.scroller { max-width: 1320px; margin: 0 auto; padding: 8px 16px; display: flex; gap: 6px; overflow-x: auto; scrollbar-width: thin; }
@media (min-width: 1100px) { .scroller { flex-wrap: wrap; overflow-x: visible; } .subs { flex-wrap: wrap; overflow-x: visible; } }
.mod { flex: 0 0 auto; border: 1px solid var(--line); background: var(--surface); color: var(--ink-2); border-radius: 999px; padding: 6px 14px; font-weight: 600; font-size: .9rem; cursor: pointer; white-space: nowrap; }
.mod .n { font-family: var(--f-mono); font-size: .76rem; margin-right: 6px; color: var(--muted); }
.mod[aria-current="true"] { background: var(--navy); border-color: var(--navy); color: var(--surface); }
.mod[aria-current="true"] .n { color: inherit; opacity: .8; }
.subs { max-width: 1320px; margin: 0 auto; padding: 14px 16px 0; display: flex; gap: 6px; overflow-x: auto; }
.sub { flex: 0 0 auto; border: 0; background: transparent; color: var(--muted); padding: 6px 10px; border-radius: 8px; font-size: .86rem; font-weight: 600; cursor: pointer; white-space: nowrap; }
.sub:hover { background: var(--tint-n); color: var(--ink); }
.sub[aria-current="true"] { background: var(--tint-g); color: var(--green-ink); }
.sub .i { font-family: var(--f-mono); font-size: .72rem; margin-right: 5px; }

/* ---------- stage ---------- */
main { max-width: 1320px; margin: 0 auto; padding-inline: 16px; padding-block: 18px 120px; }
.head { display: grid; gap: 6px; margin-bottom: 18px; max-width: 980px; }
.eyebrow { font-family: var(--f-mono); font-size: .76rem; letter-spacing: .08em; text-transform: uppercase; color: var(--green-ink); }
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; margin: 0; line-height: 1.05; }
h1 { font-size: clamp(2rem, 4.2vw, 3.1rem); font-weight: 700; letter-spacing: .005em; }
h2 { font-size: clamp(1.4rem, 2.4vw, 1.8rem); font-weight: 700; }
h3 { font-size: 1.22rem; font-weight: 600; }
.lede { font-size: 1.08rem; color: var(--ink-2); max-width: 70ch; margin: 0; }
p { margin: 0; }
.muted { color: var(--muted); }
.small { font-size: .86rem; }
.num { font-variant-numeric: tabular-nums; }
.grid { display: grid; gap: 14px; }
.g2 { grid-template-columns: repeat(auto-fit, minmax(min(100%, max(320px, calc((100% - 14px) / 2))), 1fr)); }
.g3 { grid-template-columns: repeat(auto-fit, minmax(min(100%, max(240px, calc((100% - 28px) / 3))), 1fr)); }
.g4 { grid-template-columns: repeat(auto-fit, minmax(min(100%, max(190px, calc((100% - 42px) / 4))), 1fr)); }
.split { display: grid; gap: 18px; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); align-items: start; }
@media (max-width: 900px) { .split { grid-template-columns: 1fr; } }
.stack { display: grid; gap: 12px; align-content: start; min-width: 0; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px 18px; min-width: 0; }
.card.g { background: var(--tint-g); border-color: transparent; }
.card.n { background: var(--tint-n); border-color: transparent; }
.card.y { background: var(--tint-gold); border-color: transparent; }
.card.r { background: var(--tint-red); border-color: transparent; }
.card h3 { margin-bottom: 6px; }
.k { font-family: var(--f-mono); font-size: .72rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.big { font-family: var(--f-display); font-weight: 700; font-size: clamp(1.8rem, 3.2vw, 2.4rem); line-height: 1; font-variant-numeric: tabular-nums; }
.big.g { color: var(--green-ink); } .big.n { color: var(--navy); } .big.y { color: var(--gold-ink); } .big.r { color: var(--red); }
.src { margin-top: 20px; font-size: .78rem; color: var(--muted); max-width: 120ch; }
.src b { color: var(--ink-2); }
ul.clean { margin: 0; padding-left: 1.1em; display: grid; gap: 6px; }
ul.clean li::marker { color: var(--green); }

/* ---------- buttons ---------- */
.acts { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
.ib { display: inline-flex; align-items: center; gap: 8px; border: 0; border-radius: 999px; padding: 9px 16px; font-weight: 700; font-size: .88rem; letter-spacing: .02em; cursor: pointer; text-transform: uppercase; box-shadow: var(--shadow); }
.ib::before { content: "\25BA"; font-size: .7em; }
.ib.gold { background: var(--gold); color: #1A1406; }
.ib.navy { background: var(--navy); color: var(--surface); }
.ib.green { background: var(--green); color: var(--on-accent); }
.ib.ghost { background: var(--surface); color: var(--ink); border: 1px solid var(--line); box-shadow: none; }
.ib:hover { filter: brightness(1.06); transform: translateY(-1px); }
.ib.ext::before { content: none; }
.ib.ext::after { content: "\2197"; }
.tap { cursor: pointer; transition: transform .15s ease, box-shadow .15s ease; text-align: left; font: inherit; color: inherit; width: 100%; }
.tap:hover { transform: translateY(-2px); box-shadow: var(--shadow); }
.tap .more { margin-top: 8px; font-size: .78rem; font-weight: 700; color: var(--green-ink); letter-spacing: .04em; text-transform: uppercase; }

/* ---------- hero: forecourt price board ---------- */
.hero { display: grid; gap: 22px; grid-template-columns: minmax(0, 1.1fr) minmax(0, .9fr); align-items: start; }
@media (max-width: 960px) { .hero { grid-template-columns: 1fr; } }
.hero h1 { font-size: clamp(2.3rem, 5vw, 3.7rem); }
.hero .sub2 { font-family: var(--f-display); font-weight: 600; font-size: clamp(1.3rem, 2.4vw, 1.75rem); color: var(--gold-ink); }
.board { background: var(--board); border-radius: 14px; padding: 16px; color: var(--board-label); border: 4px solid var(--board-line); box-shadow: var(--shadow); }
.board-top { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
.board-top .k { color: var(--board-label); }
.seg { display: inline-flex; border: 1px solid var(--board-line); border-radius: 999px; overflow: hidden; }
.seg button { background: transparent; border: 0; color: var(--board-label); padding: 6px 12px; font-size: .78rem; font-weight: 700; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--board-ink); color: #0D1B30; }
.brow { display: grid; grid-template-columns: 64px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 10px 4px; border-top: 1px solid var(--board-line); }
.badge { font-family: var(--f-display); font-weight: 700; font-size: 1.05rem; text-align: center; border-radius: 6px; padding: 6px 0; color: #FFFFFF; }
.badge.pms { background: #2a78d6; } .badge.ago { background: #d95926; } .badge.cng { background: #138a5f; }
.blabel b { display: block; color: #FFFFFF; font-weight: 600; }
.blabel span { font-size: .78rem; color: var(--board-label); }
.led { font-family: var(--f-mono); font-weight: 600; font-size: clamp(1.6rem, 3.6vw, 2.3rem); color: var(--board-ink); letter-spacing: .04em; font-variant-numeric: tabular-nums; text-shadow: 0 0 12px rgba(255,194,74,.35); white-space: nowrap; }
.led small { font-size: .45em; color: var(--board-label); margin-left: 4px; text-shadow: none; }
.board-foot { margin-top: 8px; font-size: .74rem; color: var(--board-label); }
.saving-pill { display: inline-block; background: #138a5f; color: #FFFFFF; border-radius: 999px; padding: 2px 10px; font-weight: 700; font-size: .8rem; margin-left: 6px; }
.who { display: grid; gap: 4px; }
.who .name { font-family: var(--f-display); font-weight: 700; font-size: 1.5rem; color: var(--navy); }
.creds { font-size: .82rem; color: var(--ink-2); line-height: 1.45; }
.roles { font-size: .9rem; font-weight: 600; color: var(--navy); }
.designer { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
.designer .plaque { height: 64px; }
.designer .plaque img { height: 56px; }
.meta { display: flex; flex-wrap: wrap; gap: 8px; }
.tag { border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px; font-size: .84rem; background: var(--surface); }

/* ---------- timeline ---------- */
.tl { display: grid; gap: 0; }
.tl-row { display: grid; grid-template-columns: 116px 22px minmax(0, 1fr); gap: 10px; align-items: start; }
.tl-row .d { font-family: var(--f-mono); font-size: .8rem; text-align: right; padding-top: 3px; font-weight: 600; }
.tl-row .dot { width: 14px; height: 14px; border-radius: 50%; margin: 5px auto 0; position: relative; }
.tl-row .dot::after { content: ""; position: absolute; left: 6px; top: 16px; width: 2px; height: 34px; background: var(--line); }
.tl-row:last-child .dot::after { display: none; }
.tl-row .t { padding-bottom: 16px; }
.shock .d { color: var(--s1); } .shock .dot { background: var(--s1); }
.resp .d { color: var(--green-ink); } .resp .dot { background: var(--green); }
@media (max-width: 520px) { .tl-row { grid-template-columns: 82px 18px minmax(0, 1fr); } }

/* ---------- charts ---------- */
.chart { width: 100%; position: relative; }
.chart svg { width: 100%; height: auto; display: block; overflow: visible; }
.chart text { fill: var(--ink-2); font-family: var(--f-body); }
.chart .val { fill: var(--ink); font-weight: 700; font-family: var(--f-mono); }
.chart .axis { stroke: var(--line); }
.chart .gridl { stroke: var(--grid); }
.legend { display: flex; flex-wrap: wrap; gap: 12px; font-size: .82rem; color: var(--ink-2); margin-top: 6px; }
.legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
.tip { position: fixed; z-index: 60; pointer-events: none; background: var(--ink); color: var(--bg); padding: 6px 10px; border-radius: 8px; font-size: .8rem; box-shadow: var(--shadow); max-width: 260px; }
.cap { font-size: .78rem; color: var(--muted); margin-top: 6px; }

/* ---------- value chain ---------- */
.chain { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 8px; }
@media (max-width: 1000px) { .chain { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
@media (max-width: 560px) { .chain { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.stage-c { border: 1px solid var(--line); border-radius: 10px; padding: 12px; background: var(--surface); display: grid; gap: 4px; align-content: start; }
.stage-c .no { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; color: #FFFFFF; font-weight: 700; font-family: var(--f-mono); font-size: .85rem; }
.ladder { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr) auto minmax(0, .8fr); gap: 10px; align-items: center; }
@media (max-width: 700px) { .ladder { grid-template-columns: 1fr; } .ladder .op { display: none; } }
.ladder .op { font-family: var(--f-display); font-size: 2rem; color: var(--muted); text-align: center; }
.rung { border-radius: 10px; padding: 14px; color: #FFFFFF; }
.rung .big { color: #FFFFFF; }

/* ---------- calculators ---------- */
.calc { display: grid; gap: 18px; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
@media (max-width: 900px) { .calc { grid-template-columns: 1fr; } }
.field { display: grid; gap: 4px; }
.field label { font-size: .85rem; font-weight: 600; color: var(--ink-2); display: flex; justify-content: space-between; gap: 8px; }
.field label output { font-family: var(--f-mono); color: var(--ink); font-variant-numeric: tabular-nums; }
.field input[type=range] { width: 100%; accent-color: var(--green); }
.out { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 150px), 1fr)); }
.out .card { padding: 12px 14px; }
.out .v { font-family: var(--f-mono); font-weight: 600; font-size: 1.25rem; font-variant-numeric: tabular-nums; }
.presets { display: flex; gap: 6px; flex-wrap: wrap; }
.presets button { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 4px 12px; font-size: .8rem; font-weight: 600; cursor: pointer; }
.presets button[aria-pressed="true"] { background: var(--tint-g); border-color: var(--green); color: var(--green-ink); }
.hbar { height: 14px; border-radius: 4px; }

/* ---------- quiz ---------- */
.q { display: grid; gap: 10px; }
.opts { display: grid; gap: 8px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 220px), 1fr)); }
.opt { text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 10px 12px; cursor: pointer; font-weight: 500; }
.opt:hover { border-color: var(--navy); }
.opt.right { background: var(--tint-g); border-color: var(--green); }
.opt.wrong { background: var(--tint-red); border-color: var(--red); }
.fb { font-size: .92rem; border-radius: 10px; padding: 10px 12px; }
.fb.ok { background: var(--tint-g); } .fb.no { background: var(--tint-red); }

/* ---------- risk heat map ---------- */
.heat { display: grid; grid-template-columns: 30px repeat(3, minmax(0, 1fr)); grid-template-rows: repeat(3, 120px) 28px; gap: 4px; }
.heat .cell { border-radius: 8px; position: relative; display: flex; flex-wrap: wrap; gap: 6px; align-content: center; justify-content: center; padding: 6px; }
.heat .ax { font-size: .72rem; color: var(--muted); display: grid; place-items: center; font-family: var(--f-mono); }
.rb { width: 44px; height: 44px; border-radius: 50%; border: 0; color: #FFFFFF; font-weight: 700; font-family: var(--f-mono); cursor: pointer; box-shadow: var(--shadow); }
.rb.hi { background: #C0392B; } .rb.md { background: var(--rbmd); }
.h1c { background: color-mix(in srgb, var(--s8) 22%, var(--surface)); }
.h2c { background: color-mix(in srgb, var(--s4) 24%, var(--surface)); }
.h3c { background: color-mix(in srgb, var(--s3) 18%, var(--surface)); }

/* ---------- misc ---------- */
.tally { display: inline-flex; align-items: center; gap: 6px; }
.tally button { width: 30px; height: 30px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-weight: 700; }
.tally span { font-family: var(--f-mono); min-width: 2ch; text-align: center; font-weight: 600; }
.check { display: flex; gap: 10px; align-items: flex-start; }
.check input { width: 20px; height: 20px; accent-color: var(--green); margin-top: 3px; flex: 0 0 auto; }
.progress { height: 8px; border-radius: 99px; background: var(--grid); overflow: hidden; }
.progress > i { display: block; height: 100%; background: var(--green); border-radius: 99px; transition: width .3s ease; }
.vid { display: grid; gap: 10px; }
.vid .poster { position: relative; border-radius: 10px; overflow: hidden; aspect-ratio: 16/9; max-width: 100%; background: #0D1B30; }
.vid .poster img { width: 100%; height: 100%; object-fit: cover; display: block; }
.vid iframe { width: 100%; aspect-ratio: 16/9; border: 0; border-radius: 10px; max-width: 100%; }
textarea, input[type=text], input[type=search], input[type=number] { width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 8px 10px; }
table.t { border-collapse: collapse; width: 100%; font-size: .9rem; }
table.t th, table.t td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
table.t th { font-family: var(--f-mono); font-size: .74rem; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.tw { overflow-x: auto; }
.countdown { font-family: var(--f-display); font-weight: 700; font-size: clamp(3rem, 7vw, 5rem); line-height: .9; color: var(--red); font-variant-numeric: tabular-nums; }

/* ---------- footer nav ---------- */
.foot { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
.foot-in { max-width: 1320px; margin: 0 auto; padding: 8px 16px; display: flex; align-items: center; gap: 12px; }
.foot .progress { flex: 1; }
.navbtn { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 7px 14px; font-weight: 700; cursor: pointer; white-space: nowrap; }
.navbtn.primary { background: var(--green); border-color: var(--green); color: var(--on-accent); }
.pos { font-family: var(--f-mono); font-size: .78rem; color: var(--muted); white-space: nowrap; }
@media (max-width: 560px) { .pos, .kbd { display: none; } }
.kbd { font-size: .74rem; color: var(--muted); white-space: nowrap; }

/* ---------- modal ---------- */
.scrim { position: fixed; inset: 0; z-index: 50; background: rgba(6, 14, 28, .55); display: grid; place-items: center; padding: 16px; }
.modal { background: var(--surface); color: var(--ink); border-radius: 16px; max-width: 760px; width: 100%; max-height: 86vh; overflow: auto; box-shadow: 0 20px 60px rgba(0,0,0,.35); border: 1px solid var(--line); animation: pop .18s ease-out; }
@keyframes pop { from { transform: translateY(8px) scale(.98); opacity: .6; } to { transform: none; opacity: 1; } }
.modal-h { display: flex; justify-content: space-between; gap: 12px; align-items: start; padding: 18px 20px 8px; position: sticky; top: 0; background: var(--surface); }
.modal-h h2 { font-size: 1.5rem; }
.modal-b { padding: 4px 20px 20px; display: grid; gap: 10px; }
.modal-b ul { margin: 0; padding-left: 1.1em; display: grid; gap: 8px; }
.modal-b li::marker { color: var(--gold); }
.x { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; width: 36px; height: 36px; cursor: pointer; font-size: 1.1rem; flex: 0 0 auto; }
.modal .k { color: var(--green-ink); }
</style>

const pl = arr => `<ul>${arr.map(x => `<li>${x}</li>`).join("")}</ul>`;
const stat = (v, l, sub, c = "g") => `<div class="card ${c}"><div class="big ${c}">${v}</div><p style="margin-top:6px"><b>${l}</b></p>${sub ? `<p class="small muted">${sub}</p>` : ""}</div>`;
const pop = (key, k, t, items) => { POPS[key] = { k, t, b: Array.isArray(items) ? pl(items) : items }; };
const quiz = (key, q, o, a, why) => { QUIZ[key] = { q, o, a, why }; };

function presenter(label = "Author &amp; Presenter") {
  return `<div class="who"><div class="k">${label}</div><div class="name">Dr. Olumuyiwa Adebayo JP</div>

}

}

pop("howto", "Presenter guide", "Using this dashboard", [
  "<b>Top row:</b> the five modules plus Toolkit, Video Vault, Knowledge Check, Sources and Close. The second row shows the screens inside the current module.",

    : [["PMS", "pms", "Petrol", "per litre", "1,355", "/L-eq"], ["AGO", "ago", "Diesel", "₦2,000 ÷ 1.13 petrol-litre energy", "1,774", "/L-eq"], ["CNG", "cng", "Compressed natural gas", "₦380 ÷ 1.08 petrol-litre energy", "352", "/L-eq"]];

        const a1 = a0 + v / tot * Math.PI * 2, large = a1 - a0 > Math.PI ? 1 : 0;
        const p = (rad, a) => [cx + rad * Math.cos(a), cy + rad * Math.sin(a)];
        const [x0, y0] = p(R, a0), [x1, y1] = p(R, a1), [x2, y2] = p(r, a1), [x3, y3] = p(r, a0);
        g += `<path d="M${x0},${y0} A${R},${R} 0 ${large} 1 ${x1},${y1} L${x2},${y2} A${r},${r} 0 ${large} 0 ${x3},${y3} Z" fill="${css(o.colors[i])}" stroke="var(--surface)" stroke-width="2"
          data-tip="${esc(o.cats[i])}: <b>${esc(o.fmt(v))}</b> (${(v / tot * 100).toFixed(1)}%)"/>`;
        a0 = a1;
      });
      g += `<text x="${cx}" y="${cy - 4}" text-anchor="middle" class="val" font-size="30">${esc(o.center)}</text><text x="${cx}" y="${cy + 20}" text-anchor="middle" font-size="13">${esc(o.centerSub)}</text>`;
      el.innerHTML = `<svg viewBox="0 0 ${S} ${S}" style="max-width:320px;margin:auto" role="img" aria-label="${esc(o.label)}">${g}</svg>
        <div class="legend" style="justify-content:center">${o.cats.map((c, i) => `<span><i style="background:${css(o.colors[i])}"></i>${esc(c)} <b class="num">${esc(o.fmt(o.vals[i]))}</b></span>`).join("")}</div>`;
    }
  };

  /* ---------- formatting ---------- */
  const N = (v, d = 0) => Number(v).toLocaleString("en-NG", { minimumFractionDigits: d, maximumFractionDigits: d });
  window.FMT = {
    naira: v => "₦" + N(Math.round(v)),
    nairaM: v => "₦" + N(v / 1e6, 1) + "m",
    nairaBn: v => "₦" + N(v / 1e9, 1) + "bn",
    nairaTrn: v => "₦" + N(v / 1e12, 2) + "trn",
    pct: (v, d = 0) => N(v * 100, d) + "%",
    n: N
  };

  /* ---------- calculators ---------- */
  function bindCalc(root, sel, fn) {
    const box = root.querySelector(sel); if (!box) return;
    const ins = $$("input", box);
    const run = () => {
      const v = {};
      ins.forEach(i => { v[i.id] = parseFloat(i.value) || 0; const o = box.querySelector(`output[for="${i.id}"]`); if (o) o.textContent = (i.dataset.fmt ? FMT[i.dataset.fmt](v[i.id]) : N(v[i.id], +(i.dataset.d || 0))) + (i.dataset.u || ""); });
      fn(v, box);
    };
    ins.forEach(i => i.addEventListener("input", () => { $$(".presets button", box).forEach(b => b.setAttribute("aria-pressed", "false")); run(); }));
    $$(".presets button", box).forEach(b => b.addEventListener("click", () => {
      const p = JSON.parse(b.dataset.p); Object.entries(p).forEach(([k, val]) => { const i = box.querySelector("#" + k); if (i) i.value = val; });
      run(); $$(".presets button", box).forEach(x => x.setAttribute("aria-pressed", String(x === b)));
    }));
    run();
  }
  window.CALC = {
    driver(root) {
      bindCalc(root, "#calc-driver", (v, box) => {
        const L = v.dl * v.dd * v.dfleet, Lc = L * v.dshare / 100;
        const pet = Lc * v.dpet, scm = Lc / 1.08, cng = scm * v.dcng, save = pet - cng;
        const paid = Math.max(0, v.dfleet - v.dfree) * v.dkit;
        const pay = save > 0 ? paid / save : Infinity;
        const set = (id, t) => { const e = box.querySelector("#" + id); if (e) e.textContent = t; };
        set("o-pet", FMT.naira(pet)); set("o-cng", FMT.naira(cng)); set("o-save", FMT.naira(save));
        set("o-pct", FMT.pct(save / pet || 0)); set("o-year", save * 12 >= 1e9 ? FMT.nairaBn(save * 12) : FMT.nairaM(save * 12));
        set("o-pay", isFinite(pay) ? (N(pay, 1) + " months (" + N(pay * 52 / 12, 0) + " weeks)") : "n/a");
        set("o-out", FMT.naira(paid));
        const w = Math.max(pet, 1); box.querySelector("#b-pet").style.width = "100%"; box.querySelector("#b-cng").style.width = (cng / w * 100) + "%";
      });
    },
    vat(root) {
      bindCalc(root, "#calc-vat", (v, box) => {
        const iv = v.vin * 1e6 * v.vrate / 100;
        box.querySelector("#o-iv").textContent = FMT.nairaM(iv);
        box.querySelector("#o-ivp").textContent = FMT.pct(iv / (v.vsales * 1e6) || 0, 1) + " of sales";
        box.querySelector("#o-zr").textContent = FMT.nairaM(iv) + " recoverable";
      });
    },
    sov(root) {
      bindCalc(root, "#calc-sov", (v, box) => {
        const L = v.sveh * v.sl * v.sd, pet = L * v.spet, scm = L / 1.08, cng = scm * v.scng, save = pet - cng;
        const bcfd = scm / 365 * 35.3147 / 1e9;
        const set = (id, t) => { box.querySelector("#" + id).textContent = t; };
        set("o-L", N(L / 1e9, 2) + "bn L a year"); set("o-petb", FMT.nairaTrn(pet)); set("o-cngb", FMT.nairaTrn(cng));
        set("o-sav", FMT.nairaTrn(save)); set("o-bcf", N(bcfd, 2) + " bcf/d");
        set("o-dom", FMT.pct(bcfd / 2.18, 0) + " of May 2026 domestic gas sales");
        set("o-fl", FMT.pct(bcfd / (323 / 365), 0) + " of 2025 average flaring");
        set("o-wv", N(save / 3.3e12, 2) + "× the ₦3.3trn of 2026 petrol waivers");
      });
    },
    etr(root) {
      bindCalc(root, "#calc-etr", (v, box) => {
        const etr = v.eprofit > 0 ? v.etax / v.eprofit : 0, min = v.eprofit * 0.15, top = Math.max(0, min - v.etax);
        box.querySelector("#o-etr").textContent = FMT.pct(etr, 1);
        box.querySelector("#o-top").textContent = "₦" + N(top, 2) + "bn";
        box.querySelector("#o-net").textContent = "₦" + N(Math.max(0, v.eprofit * 0.30 - Math.max(v.etax, min)), 2) + "bn";
      });
    }
  };

  /* ---------- quizzes ---------- */
  function bindQuiz(root) {
    $$(".q[data-q]", root).forEach(qel => {
      const q = QUIZ[qel.dataset.q]; if (!q) return;
      const ans = store.get("q:" + qel.dataset.q, null);
      const show = (i) => {
        $$(".opt", qel).forEach((b, j) => { b.classList.toggle("right", j === q.a); b.classList.toggle("wrong", j === i && i !== q.a); b.disabled = true; });
        const fb = $(".fb", qel); fb.hidden = false; fb.className = "fb " + (i === q.a ? "ok" : "no");
        fb.innerHTML = `<b>${i === q.a ? "Correct." : "Not quite."}</b> ${q.why}`;
      };
      $$(".opt", qel).forEach((b, i) => b.addEventListener("click", () => { store.set("q:" + qel.dataset.q, i); show(i); window.dispatchEvent(new Event("quizchange")); }));
      if (ans !== null) show(ans);
    });
  }
  window.quizHTML = (key, n) => {
    const q = QUIZ[key];
    return `<div class="card q" data-q="${key}"><div class="k">Question ${n || ""}</div><h3>${q.q}</h3>
      <div class="opts">${q.o.map((o, i) => `<button class="opt" type="button">${String.fromCharCode(65 + i)}) ${o}</button>`).join("")}</div>
      <div class="fb" hidden></div></div>`;
  };
  window.resetQuiz = keys => { keys.forEach(k => { try { localStorage.removeItem("cngdash:q:" + k); } catch (e) { } }); render(false); };

  /* ---------- tallies, checklists, notes ---------- */
  function bindTallies(root) {
    $$(".tally[data-t]", root).forEach(t => {
      const k = "t:" + t.dataset.t, s = $("span", t);
      let v = store.get(k, 0); s.textContent = v;
      $$("button", t).forEach(b => b.addEventListener("click", () => { v = Math.max(0, v + (+b.dataset.d)); s.textContent = v; store.set(k, v); }));
    });
    $$("input[type=checkbox][data-c]", root).forEach(c => {
      c.checked = !!store.get("c:" + c.dataset.c, false);
      c.addEventListener("change", () => { store.set("c:" + c.dataset.c, c.checked); updateChecks(root); });
    });
    updateChecks(root);
    $$("textarea[data-n], input[type=text][data-n]", root).forEach(t => {
      t.value = store.get("n:" + t.dataset.n, "");
      t.addEventListener("input", () => store.set("n:" + t.dataset.n, t.value));
    });
  }
  function updateChecks(root) {
    const all = $$("input[type=checkbox][data-c]", root); if (!all.length) return;
    const done = all.filter(c => c.checked).length, bar = $("#checkbar", root), lab = $("#checklab", root);
    if (bar) bar.style.width = (done / all.length * 100) + "%";
    if (lab) lab.textContent = `${done} of ${all.length} checks complete`;
  }

  /* ---------- videos ---------- */
  let cspBlocked = false;
  document.addEventListener("securitypolicyviolation", e => {
    if (/frame/.test(e.violatedDirective || e.effectiveDirective || "")) {
      cspBlocked = true;
      $$(".vid iframe").forEach(f => { const box = f.closest(".vid"); f.outerHTML = `<div class="card y small">This viewer blocks embedded players. Use <b>Watch on YouTube</b> below; it opens in a new tab.</div>`; });
    }
  });
  function bindVideos(root) {
    $$("[data-play]", root).forEach(b => b.addEventListener("click", () => {
      const box = b.closest(".vid"), poster = $(".poster", box);
      if (cspBlocked) { poster.insertAdjacentHTML("afterend", `<div class="card y small">This viewer blocks embedded players. Use <b>Watch on YouTube</b>.</div>`); b.disabled = true; return; }
      poster.outerHTML = `<iframe src="https://www.youtube-nocookie.com/embed/${b.dataset.play}?autoplay=1&rel=0" title="${esc(b.dataset.title || "video")}" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe>`;
      b.disabled = true;
    }));
  }

  /* ---------- copy ---------- */
  function bindCopy(root) {
    $$("[data-copy]", root).forEach(b => b.addEventListener("click", () => {
      const src = document.getElementById(b.dataset.copy); const text = src ? (src.value !== undefined && src.tagName !== "DIV" ? src.value : src.innerText) : b.dataset.text;
      const done = () => { const o = b.textContent; b.textContent = "Copied"; setTimeout(() => b.textContent = o, 1400); };
      const fallback = () => { if (src) { const r = document.createRange(); r.selectNodeContents(src); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r); } b.textContent = "Selected: press Ctrl/Cmd+C"; };
      try { navigator.clipboard.writeText(text).then(done, fallback); } catch (e) { fallback(); }
    }));
  }
  window.ENGINE_AFTER = root => { bindQuiz(root); bindTallies(root); bindVideos(root); bindCopy(root); };

  /* ---------- session clock ---------- */
  let t0 = null, acc = store.get("clock", 0), tick = null;
  const AGENDA = [[0, "Opening"], [10, "Module 1"], [30, "Module 2"], [55, "Module 3"], [80, "Module 4"], [105, "Module 5 & close"], [120, "Over time"]];
  function clockText() {
    const ms = acc + (t0 ? Date.now() - t0 : 0), m = Math.floor(ms / 60000), s = Math.floor(ms / 1000) % 60;
    let seg = AGENDA[0][1]; AGENDA.forEach(([at, lab]) => { if (m >= at) seg = lab; });
    return `${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")} · ${seg}`;
  }
  function paintClock() { $("#clock").textContent = clockText(); $("#clockbtn").setAttribute("aria-pressed", String(!!t0)); $("#clockbtn").firstChild.textContent = t0 ? "Pause " : "Start "; }
  function toggleClock() {
    if (t0) { acc += Date.now() - t0; t0 = null; clearInterval(tick); store.set("clock", acc); }
    else { t0 = Date.now(); tick = setInterval(paintClock, 1000); }
    paintClock();
  }

  /* ---------- theme ---------- */
  const THEMES = ["system", "light", "dark"];
  function applyTheme(t) {
    if (t === "system") document.documentElement.removeAttribute("data-theme"); else document.documentElement.setAttribute("data-theme", t);
    $("#themebtn").textContent = "Theme: " + t[0].toUpperCase() + t.slice(1);
    store.set("theme", t);
  }

  /* ---------- events ---------- */
  document.addEventListener("click", e => {
    const p = e.target.closest("[data-pop]"); if (p) { e.preventDefault(); openPop(p.dataset.pop); return; }
    const g = e.target.closest("[data-go]"); if (g) { e.preventDefault(); go(g.dataset.go); return; }
    if (e.target.closest("[data-close]") || e.target.id === "scrim") { closePop(); return; }
  });
  document.addEventListener("keydown", e => {
    if (!$("#scrim").hidden) { if (e.key === "Escape") closePop(); return; }
    if (e.target.closest("input, textarea, select")) return;
    if (e.key === "ArrowRight" || e.key === "PageDown") { step(1); e.preventDefault(); }
    else if (e.key === "ArrowLeft" || e.key === "PageUp") { step(-1); e.preventDefault(); }
    else if (e.key === "Home") { go(FLAT[0].id); }
  });
  window.addEventListener("hashchange", () => { const h = location.hash.slice(1); if (h in byId && FLAT[idx].id !== h) go(h); });

  function boot() {
    buildMods();
    $("#prev").addEventListener("click", () => step(-1));
    $("#next").addEventListener("click", () => step(1));
    $("#clockbtn").addEventListener("click", toggleClock);
    $("#clockreset").addEventListener("click", () => { acc = 0; t0 = null; clearInterval(tick); store.set("clock", 0); paintClock(); });
    $("#themebtn").addEventListener("click", () => { const cur = store.get("theme", "system"); applyTheme(THEMES[(THEMES.indexOf(cur) + 1) % 3]); });
    $("#fsbtn").addEventListener("click", () => {
      const d = document; try {
        if (d.fullscreenElement) d.exitFullscreen().catch(() => { });
        else d.documentElement.requestFullscreen().catch(() => { $("#fsbtn").textContent = "Full screen unavailable"; });
      } catch (err) { $("#fsbtn").textContent = "Full screen unavailable"; }
    });
    applyTheme(store.get("theme", "system"));
    paintClock();
    const setBarH = () => document.documentElement.style.setProperty("--barh", $("#bar").offsetHeight + "px");
    setBarH(); window.addEventListener("resize", setBarH);
    const h = location.hash.slice(1);
    idx = (h in byId) ? byId[h] : (byId[store.get("last", "")] ?? 0);
    render(false);
  }
  boot();
})();

</script>
</body>
</html>
